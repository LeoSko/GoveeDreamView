name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build -c Release GoveeDreamView.csproj
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net48/GoveeDreamView.exe
